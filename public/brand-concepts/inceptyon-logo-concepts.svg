<svg width="1800" height="1400" viewBox="0 0 1800 1400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text {
        font-family: Geist, Inter, Arial, sans-serif;
        letter-spacing: 0;
      }

      .word {
        font-size: 76px;
        font-weight: 900;
        fill: #ebe6d7;
      }

      .labs {
        font-size: 28px;
        font-weight: 600;
        fill: #8c96a3;
        letter-spacing: 10px;
      }

      .label {
        font-size: 18px;
        font-weight: 700;
        fill: #e1925a;
        letter-spacing: 3px;
      }

      .note {
        font-size: 24px;
        font-weight: 500;
        fill: #ebe6d7;
      }

      .small {
        font-size: 17px;
        font-weight: 500;
        fill: #8c96a3;
      }

      .mono {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 15px;
        fill: #8c96a3;
      }
    </style>

    <symbol id="word-y" viewBox="0 0 84 108">
      <path d="M12 12 L42 48 L72 12" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="square" stroke-linejoin="miter"/>
      <path d="M42 48 V96" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="square"/>
    </symbol>

    <symbol id="mark-y-drift" viewBox="0 0 220 220">
      <rect x="8" y="8" width="204" height="204" fill="none" stroke="#ebe6d7" stroke-width="10"/>
      <path d="M54 58 L110 118 L166 58" fill="none" stroke="#ebe6d7" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter"/>
      <path d="M110 118 V166" fill="none" stroke="#ebe6d7" stroke-width="24" stroke-linecap="square"/>
      <path d="M146 118 H176" fill="none" stroke="#e1925a" stroke-width="14" stroke-linecap="square"/>
    </symbol>

    <symbol id="mark-turnstile" viewBox="0 0 220 220">
      <rect x="8" y="8" width="204" height="204" fill="none" stroke="#ebe6d7" stroke-width="10"/>
      <path d="M44 66 H88 L122 100 H176" fill="none" stroke="#ebe6d7" stroke-width="22" stroke-linecap="square" stroke-linejoin="miter"/>
      <path d="M176 154 H132 L98 120 H44" fill="none" stroke="#ebe6d7" stroke-width="22" stroke-linecap="square" stroke-linejoin="miter"/>
      <path d="M110 44 V176" fill="none" stroke="#0e1218" stroke-width="18" stroke-linecap="square"/>
      <rect x="154" y="40" width="30" height="14" fill="#e1925a"/>
    </symbol>

    <symbol id="mark-index" viewBox="0 0 220 220">
      <rect x="8" y="8" width="204" height="204" fill="none" stroke="#ebe6d7" stroke-width="10"/>
      <rect x="50" y="54" width="120" height="18" fill="#ebe6d7"/>
      <rect x="50" y="94" width="92" height="18" fill="#ebe6d7"/>
      <rect x="50" y="134" width="138" height="18" fill="#ebe6d7"/>
      <path d="M74 54 L114 112 L154 54" fill="none" stroke="#0e1218" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter"/>
      <path d="M114 112 V166" fill="none" stroke="#0e1218" stroke-width="16" stroke-linecap="square"/>
      <rect x="170" y="94" width="26" height="18" fill="#e1925a"/>
    </symbol>

    <symbol id="mark-nested" viewBox="0 0 220 220">
      <path d="M8 8 H76 M144 8 H212 M212 8 V76 M212 144 V212 M212 212 H144 M76 212 H8 M8 212 V144 M8 76 V8" fill="none" stroke="#ebe6d7" stroke-width="10" stroke-linecap="square"/>
      <path d="M48 48 H96 M124 48 H172 M172 48 V96 M172 124 V172 M172 172 H124 M96 172 H48 M48 172 V124 M48 96 V48" fill="none" stroke="#ebe6d7" stroke-width="8" stroke-linecap="square"/>
      <path d="M72 76 L110 116 L148 76" fill="none" stroke="#ebe6d7" stroke-width="18" stroke-linecap="square" stroke-linejoin="miter"/>
      <path d="M110 116 V152" fill="none" stroke="#ebe6d7" stroke-width="18" stroke-linecap="square"/>
      <rect x="34" y="34" width="28" height="12" fill="#e1925a"/>
    </symbol>
  </defs>

  <rect width="1800" height="1400" fill="#0e1218"/>
  <path d="M0 160 H1800 M0 450 H1800 M0 740 H1800 M0 1030 H1800" stroke="#ebe6d7" stroke-opacity="0.22" stroke-width="1"/>

  <text x="80" y="86" class="word" style="font-size: 54px;">INCEPTYON LABS</text>
  <text x="82" y="124" class="mono">VECTOR CONCEPT BOARD / WORDMARK-FIRST / NO CIRCLES / NO TARGETS</text>

  <g transform="translate(80 200)">
    <text x="0" y="0" class="label">A / Y-DRIFT WORDMARK</text>
    <use href="#mark-y-drift" x="0" y="28" width="220" height="220"/>
    <g transform="translate(310 68)">
      <text x="0" y="66" class="word">INCEPT</text>
      <use href="#word-y" x="315" y="0" width="56" height="78" color="#ebe6d7"/>
      <text x="378" y="66" class="word">ON</text>
      <text x="3" y="118" class="labs">LABS</text>
    </g>
    <text x="1180" y="80" class="note">Makes the portfolio fingerprint explicit.</text>
    <text x="1180" y="118" class="small">Y drift ties the studio name to the project family.</text>
    <text x="1180" y="150" class="small">Strongest parent-brand candidate.</text>
  </g>

  <g transform="translate(80 490)">
    <text x="0" y="0" class="label">B / TURNSTILE PATH</text>
    <use href="#mark-turnstile" x="0" y="28" width="220" height="220"/>
    <g transform="translate(310 68)">
      <text x="0" y="66" class="word">INCEPT</text>
      <use href="#word-y" x="315" y="0" width="56" height="78" color="#ebe6d7"/>
      <text x="378" y="66" class="word">ON</text>
      <text x="3" y="118" class="labs">LABS</text>
    </g>
    <text x="1180" y="80" class="note">Uses the named-project grammar.</text>
    <text x="1180" y="118" class="small">Mirrored lanes: Turnstile, Pincer, Tenet, PASIV.</text>
    <text x="1180" y="150" class="small">More apparatus than publisher imprint.</text>
  </g>

  <g transform="translate(80 780)">
    <text x="0" y="0" class="label">C / PROJECT INDEX</text>
    <use href="#mark-index" x="0" y="28" width="220" height="220"/>
    <g transform="translate(310 68)">
      <text x="0" y="66" class="word">INCEPT</text>
      <use href="#word-y" x="315" y="0" width="56" height="78" color="#ebe6d7"/>
      <text x="378" y="66" class="word">ON</text>
      <text x="3" y="118" class="labs">LABS</text>
    </g>
    <text x="1180" y="80" class="note">Studio as catalog, not app icon.</text>
    <text x="1180" y="118" class="small">Dossier rows plus the Y cut into the index.</text>
    <text x="1180" y="150" class="small">Safest for GitHub/Sponsors.</text>
  </g>

  <g transform="translate(80 1070)">
    <text x="0" y="0" class="label">D / NESTED SYSTEM</text>
    <use href="#mark-nested" x="0" y="28" width="220" height="220"/>
    <g transform="translate(310 68)">
      <text x="0" y="66" class="word">INCEPT</text>
      <use href="#word-y" x="315" y="0" width="56" height="78" color="#ebe6d7"/>
      <text x="378" y="66" class="word">ON</text>
      <text x="3" y="118" class="labs">LABS</text>
    </g>
    <text x="1180" y="80" class="note">Tesseract / nested dossier structure.</text>
    <text x="1180" y="118" class="small">Square-within-square, project-within-lab.</text>
    <text x="1180" y="150" class="small">Most faithful to the brand kit.</text>
  </g>
</svg>
